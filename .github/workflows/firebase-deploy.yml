name: 🚀 Deploy Automático - Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Injetar data e hora do deploy no badge
        run: |
          DEPLOY_DATE=$(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M')
          sed -i "s|__DEPLOY_DATE__|${DEPLOY_DATE}|g" app.html

      # Versão fixa: com @latest, uma release nova do firebase-tools podia
      # quebrar o deploy sem nenhuma mudança no repositório.
      # Autenticação: service account (FIREBASE_SERVICE_ACCOUNT, JSON da chave)
      # quando o secret existir; senão o FIREBASE_TOKEN legado (--token,
      # descontinuado pelo Firebase). Depois de criar o secret novo, o
      # FIREBASE_TOKEN pode ser apagado.
      - name: 🔥 Deploy para Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Autenticando com service account"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            npx -y firebase-tools@15.30.2 deploy --only hosting --project demurragemanager --non-interactive
          else
            echo "::warning::Usando FIREBASE_TOKEN (descontinuado). Configure o secret FIREBASE_SERVICE_ACCOUNT."
            npx -y firebase-tools@15.30.2 deploy --only hosting --project demurragemanager --non-interactive --token "$FIREBASE_TOKEN"
          fi
