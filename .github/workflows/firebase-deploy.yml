name: 🚀 Deploy Automático - Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Injetar data e hora do deploy no badge
        run: |
          DEPLOY_DATE=$(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M')
          sed -i "s|__DEPLOY_DATE__|${DEPLOY_DATE}|g" app.html

      - name: 🔥 Deploy para Firebase Hosting
        run: npx -y firebase-tools@latest deploy --only hosting --project demurragemanager --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
